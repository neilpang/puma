name: FreeBSD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: freebsd ruby
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: repo checkout
        uses: actions/checkout@v7

      - name: test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          cache-after-prepare: true
          envs: 'CI PUMA_TEST_DEBUG TESTOPTS MT_CPU RUNNER_TOOL_CACHE GITHUB_ACTIONS'
          prepare: |
            pkg install -y git devel/ragel devel/ruby-gems gmake
          run: |
            set -e
            # Puma's suite opens a lot of sockets; CONTRIBUTING.md recommends
            # a file limit of 4000 or more.
            ulimit -n 4000 || true
            ulimit -n
            ruby -v
            ragel --version | head -1
            gem install --no-document bundler
            bundle install --jobs 4
            bundle exec rake compile
            rc=0
            test/runner --verbose || rc=$?
            # EXPERIMENT: is anything still alive after the suite?
            echo "--- processes still holding the session ---"
            pgrep -fl puma || echo "  none"
            # Integration tests spawn puma servers; a survivor holding the
            # session's stdout keeps the ssh command from returning, and the
            # job then sits idle until it times out.
            pkill -f puma 2>/dev/null || true
            exit $rc
        env:
          CI: true
          GITHUB_ACTIONS: true
          PUMA_TEST_DEBUG: true
          TESTOPTS: -v
          MT_CPU: 2
